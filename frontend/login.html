<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel de Processamento Panavideo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="login-body">
    
    <canvas id="reactive-background" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></canvas>

    <div class="card login-card shadow-lg" style="z-index: 10;">
        <div id="scanner-reticle">
            <div class="center-dot"></div>
        </div>
        
        <div class="card-body p-5">
            <div class="text-center mb-4 logo-container">
                <img src="assets/logo.png" alt="Panavideo Logo" id="login-logo">
            </div>
            <h4 class="card-title text-center mb-4" style="color: white;">SIGA - PANAVIDEO</h4>
            <form id="login-form">
                <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                <div class="mb-3">
                    <label for="username" class="form-label">Utilizador</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="login.js"></script>
    <script src="reactive_grid.js"></script>
</body>
</html>
