<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Processamento - SIGA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container-fluid p-0">
            <a class="navbar-brand" href="hub.html"><span class="navbar-brand-text">PANAVIDEO</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="index.html"><i class="fas fa-microchip me-2"></i>Processamento</a></li>
                    <li class="nav-item"><a class="nav-link" href="autuacao.html"><i class="fas fa-gavel me-2"></i>Autuação</a></li>
                    <div class="vr mx-3 d-none d-lg-block text-secondary"></div>
                    <li class="nav-item"><a class="nav-link logout-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt me-2"></i>Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="app-container d-flex justify-content-center">
        <div class="row g-0 main-content-row w-100">
            
            <div id="left-column" class="col-lg-3 col-md-4 p-0 glass-panel" style="border-radius: 0; border-top: none; border-bottom: none;">
                <div class="p-3 border-bottom border-secondary bg-black bg-opacity-20">
                    <label class="form-label small text-white mb-1 fw-bold"><i class="fas fa-filter me-1 text-primary"></i>Filtrar Câmera</label>
                    <select id="camera-filter" class="form-select form-select-sm dark-input border-0"><option value="all">Todas as Câmeras</option></select>
                </div>
                <div id="thumbnail-list" class="flex-grow-1">
                    <div class="text-center mt-5"><div class="spinner-border text-primary"></div></div>
                </div>
            </div>

            <div id="center-column" class="col-lg-6 col-md-8 p-3 position-relative d-flex flex-column justify-content-start">
                
                <div style="flex: 1; display: flex; align-items: flex-start; justify-content: center; overflow: hidden; position: relative; width: 100%; height: 100%;">
                    <div id="image-container" style="transition: transform 0.05s linear; cursor: grab; transform-origin: center center; position: relative; display: inline-block;">
                        
                        <img id="main-image" src="" class="shadow-lg rounded" style="max-height: 65vh; max-width: 100%; display: none; pointer-events: none;" draggable="false">
                        
                        <video id="main-video" class="shadow-lg rounded" style="max-height: 65vh; max-width: 100%; display: none; pointer-events: none;" loop muted playsinline></video>

                        <canvas id="redaction-canvas" style="position: absolute; top: 0; left: 0; display: none; cursor: crosshair; touch-action: none;"></canvas>
                    </div>
                    <p id="placeholder-text" class="text-muted position-absolute" style="top: 50%; transform: translateY(-50%);"><i class="fas fa-images fa-2x mb-2 d-block text-center"></i>Selecione uma imagem</p>
                </div>

                <div id="image-toolbar" class="glass-panel mt-2 p-2 w-100" style="display: none;">
                    <div class="row g-2 align-items-center justify-content-between">
                        
                        <div class="col-auto pe-2 border-end border-secondary">
                            <button id="toggle-media-btn" class="btn btn-sm btn-primary fw-bold" style="display: none;">
                                <i class="fas fa-video me-1"></i> VER VÍDEO
                            </button>
                        </div>

                        <div class="col-auto border-end border-secondary pe-2 ps-2">
                            <div class="btn-group btn-group-sm">
                                <button id="toggle-redaction-btn" class="btn btn-outline-danger" title="Modo Tarja"><i class="fas fa-pen-square"></i></button>
                                <button id="undo-redaction-btn" class="btn btn-outline-secondary" title="Desfazer" disabled><i class="fas fa-undo"></i></button>
                            </div>
                        </div>

                        <div class="col-auto">
                            <div class="btn-group btn-group-sm">
                                <button id="zoom-out-btn" class="btn btn-secondary"><i class="fas fa-minus"></i></button>
                                <button id="reset-view-btn" class="btn btn-outline-light"><i class="fas fa-compress-arrows-alt"></i></button>
                                <button id="zoom-in-btn" class="btn btn-secondary"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                        
                        <div class="col-auto border-start border-secondary ps-2">
                            <button id="btn-invert" class="btn btn-sm btn-outline-warning me-1" title="Inverter (I)"><i class="fas fa-adjust"></i> Inv</button>
                            <button id="btn-grayscale" class="btn btn-sm btn-outline-light" title="P/B"><i class="fas fa-tint-slash"></i> P/B</button>
                        </div>

                        <div class="col d-flex flex-column justify-content-center px-2 border-start border-secondary">
                            <div class="d-flex align-items-center mb-1"><i class="fas fa-sun text-warning me-2 small"></i><input type="range" class="form-range" id="brightness-slider" min="50" max="200" value="100"></div>
                            <div class="d-flex align-items-center"><i class="fas fa-circle-half-stroke text-info me-2 small"></i><input type="range" class="form-range" id="contrast-slider" min="50" max="200" value="100"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="right-column" class="col-lg-3 d-none d-lg-flex flex-column p-3">
                
                <div class="glass-panel mb-3 shadow-lg overflow-hidden">
                    <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center bg-black bg-opacity-30">
                        <small class="fw-bold text-info"><i class="fas fa-database me-1"></i>BASE DETRAN</small>
                        <span id="detran-badge" class="badge bg-secondary border border-secondary text-white">Aguardando...</span>
                    </div>
                    <div class="card-body p-3">
                        <div class="row mb-2">
                            <div class="col-4 text-secondary small text-uppercase fw-bold" style="font-size: 0.75rem;">Modelo:</div>
                            <div class="col-8 text-end">
                                <span class="text-white small fw-bold text-truncate d-block" id="detran-modelo">---</span>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-4 text-secondary small text-uppercase fw-bold" style="font-size: 0.75rem;">Ano/Cor:</div>
                            <div class="col-8 text-end">
                                <span class="text-white small" id="detran-info">---</span>
                            </div>
                        </div>

                        <div id="detran-alert" class="alert alert-danger mt-3 mb-0 p-2 text-center fw-bold d-none shadow-lg border-danger" style="animation: pulse 1.5s infinite;">
                            <i class="fas fa-exclamation-triangle me-2"></i> <span id="detran-alert-text">VEÍCULO ROUBADO/FURTADO</span>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white fw-bold small text-uppercase letter-spacing-1">Placa Identificada</label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-primary border-0 text-white"><i class="fas fa-car-side"></i></span>
                        <input type="text" id="license-plate" class="form-control dark-input text-white text-uppercase text-center fw-bold fs-3" placeholder="ABC-1234" maxlength="8" style="letter-spacing: 2px;">
                    </div>
                </div>
                
                <div class="d-grid gap-3">
                    <button id="validate-btn" class="btn btn-success py-3 shadow-lg fw-bold"><i class="fas fa-check-circle me-2"></i> VALIDAR (V) </button>
                    <button id="discard-btn" class="btn btn-danger py-3 shadow-lg fw-bold"><i class="fas fa-trash-alt me-2"></i> DESCARTAR (D) </button>
                    <hr class="border-secondary my-1">
                   <!-- <button id="bad-plate-btn" class="btn btn-warning text-dark fw-bold"><i class="fas fa-eye-slash me-2"></i></button>-->
                    <button id="special-vehicle-btn" class="btn btn-info text-white fw-bold"><i class="fas fa-star me-2"></i>  CIRCULAÇÃO AUTORIZADA </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="discardModal" tabindex="-1" aria-labelledby="discardModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-danger" id="discardModalLabel"><i class="fas fa-trash-alt me-2"></i>Motivo do Descarte</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Por favor, informe o motivo do descarte desta imagem:</p>
                    <form id="discard-form">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="discardReason" id="reason1" value="Falso Positivo" checked>
                            <label class="form-check-label" for="reason1">Sem Veículo/Outro Objeto</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="discardReason" id="reason2" value="Sem OCR Válida">
                            <label class="form-check-label" for="reason2">Imagem sem OCR Válida (Ilegível)</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="discardReason" id="reason3" value="Outros">
                            <label class="form-check-label" for="reason3">Outros</label>
                        </div>
                        
                        <div id="other-reason-container" class="d-none">
                            <label for="discardDescription" class="form-label small text-white">Descreva o motivo:</label>
                            <textarea class="form-control bg-secondary text-white border-secondary" id="discardDescription" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger fw-bold" id="confirm-discard-btn">CONFIRMAR DESCARTE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script src="logout.js"></script>
</body>
</html>
