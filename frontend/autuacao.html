<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Autuação - SIGA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar navbar-expand navbar-dark navbar-custom">
        <div class="container-fluid p-0"> 
            <a class="navbar-brand" href="hub.html">
                <span class="navbar-brand-text">PANAVIDEO</span>
            </a>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-microchip"></i>Processamento</a></li>
                    <li class="nav-item"><a class="nav-link active" href="autuacao.html"><i class="fas fa-gavel"></i>Autuação</a></li>
                    <div class="vr-separator"></div>
                    <li class="nav-item"><a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i>Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-0 app-container">
        
        <div id="left-column" class="col-lg-3 col-md-3 d-flex flex-column glass-panel" style="border-radius: 0; border-top: none; border-bottom: none;">
            <div class="p-3 border-bottom border-secondary bg-black bg-opacity-20">
                <label class="text-white small mb-1 fw-bold"><i class="fas fa-filter me-1 text-primary"></i>Filtrar Câmera</label>
                <select id="camera-filter" class="form-select form-select-sm dark-input border-0">
                    <option value="all">Todas as Câmeras</option>
                </select>
            </div>
            <div id="thumbnail-list" class="flex-grow-1"></div>
        </div>

        <div id="center-column" class="col-lg-6 col-md-6">
            
            <div id="viewer-area" style="display: none;" class="glass-panel p-2 shadow-lg">
                <div id="image-wrapper">
                    <img id="main-image" src="" alt="Evidência" class="rounded shadow">
                    <canvas id="redaction-canvas"></canvas>
                </div>
            </div>
            
            <p id="viewer-placeholder" class="text-white opacity-50 mt-5 text-center w-100" style="position: absolute; top: 40%;"><i class="fas fa-arrow-left me-2"></i> Selecione uma imagem</p>

            <div id="image-controls" class="custom-toolbar" style="display: none;">
                
                <div class="tool-group">
                    <button id="toggle-redaction-btn" class="btn-tool" title="Desenhar Tarja (C)"><i class="fas fa-pen"></i></button>
                    <button id="toggle-pan-btn" class="btn-tool" title="Mover Imagem (M)"><i class="fas fa-hand-paper"></i></button>
                    <button id="undo-redaction-btn" class="btn-tool" title="Desfazer Tarja" disabled><i class="fas fa-undo"></i></button>
                    
                    <div class="divider" style="height: 20px; margin: 0 8px;"></div>
                    <button id="toggle-crop-btn" class="btn-tool" title="Recortar Imagem"><i class="fas fa-crop-alt"></i></button>
                    <button id="undo-crop-btn" class="btn-tool" title="Desfazer Corte" disabled><i class="fas fa-history"></i></button>
                </div>

                <div class="divider"></div>

                <div class="tool-group">
                    <button id="zoom-out-btn" class="btn-tool"><i class="fas fa-minus"></i></button>
                    <button id="zoom-reset-btn" class="btn-tool"><i class="fas fa-compress-arrows-alt"></i></button>
                    <button id="zoom-in-btn" class="btn-tool"><i class="fas fa-plus"></i></button>
                </div>

                <div class="divider"></div>

                <button id="btn-invert" class="btn-toggle-filter btn-inv"><i class="fas fa-adjust"></i> Inv</button>
                <button id="btn-grayscale" class="btn-toggle-filter btn-pb"><i class="fas fa-eye-slash"></i> P/B</button>

                <div class="divider"></div>

                <div class="slider-wrapper">
                    <div class="slider-row"><i class="fas fa-sun slider-icon"></i><input type="range" id="brightness-slider" min="50" max="200" value="100"></div>
                    <div class="slider-row"><i class="fas fa-circle-half-stroke slider-icon"></i><input type="range" id="contrast-slider" min="50" max="200" value="100"></div>
                </div>
            </div>
        </div>

        <div id="right-column" class="col-lg-3 col-md-3 p-3">
            <div id="actions-panel" style="display: none; height: 100%; flex-direction: column;">
                
                <div id="feedback-message" class="alert d-none small mb-3" role="alert"></div>

                <div class="glass-panel mb-3 shadow-lg overflow-hidden">
                    <div class="card-header py-2 px-3 d-flex justify-content-between align-items-center bg-black bg-opacity-30">
                        <small class="fw-bold text-info"><i class="fas fa-database me-1"></i>BASE DETRAN</small>
                        <span id="detran-badge" class="badge bg-secondary border border-secondary text-white">Aguardando...</span>
                    </div>
                    <div class="card-body p-3">
                        <div class="row mb-2">
                            <div class="col-4 text-secondary small text-uppercase fw-bold" style="font-size: 0.75rem;">Modelo:</div>
                            <div class="col-8 text-end">
                                <span class="text-white small fw-bold text-truncate d-block" id="detran-modelo">---</span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-4 text-secondary small text-uppercase fw-bold" style="font-size: 0.75rem;">Ano/Cor:</div>
                            <div class="col-8 text-end">
                                <span class="text-white small" id="detran-info">---</span>
                            </div>
                        </div>
                        
                        <div id="detran-alert" class="alert alert-danger mt-3 mb-0 p-2 text-center fw-bold d-none shadow-lg border-danger" style="animation: pulse 1.5s infinite;">
                            <i class="fas fa-exclamation-triangle me-2"></i> <span id="detran-alert-text">VEÍCULO ROUBADO/FURTADO</span>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="text-white fw-bold small">PLACA IDENTIFICADA</label>
                    <input type="text" id="license-plate" class="form-control dark-input fw-bold fs-3 text-center text-uppercase mt-2" maxlength="8" style="letter-spacing: 3px;" placeholder="ABC1234">
                </div>

                <form id="autuacao-form" class="d-flex flex-column flex-grow-1">
                    <div class="mb-3">
                        <label class="text-white fw-bold small">TIPIFICAÇÃO</label>
                        <input type="text" class="form-control dark-input mt-1 infraction-type-input" list="infraction-list" placeholder="Selecione a infração..." required>
                    </div>

                    <div class="mb-3 flex-grow-1">
                         <label class="text-white fw-bold small">OBSERVAÇÕES</label>
                         <textarea id="obs-input" class="form-control dark-input mt-1" rows="3" placeholder="Detalhes adicionais..."></textarea>
                    </div>

                    <div class="mt-auto d-grid gap-2">
                        <button type="button" id="download-btn" class="btn btn-outline-info"><i class="fas fa-download"></i> Baixar</button>
                        <button type="submit" class="btn btn-success fw-bold py-2"><i class="fas fa-check-circle"></i> VALIDAR / AUTUAR</button>
                        <button type="button" id="discard-btn" class="btn btn-danger py-2"><i class="fas fa-trash"></i> DESCARTAR</button>
                    </div>
                </form>
                
                <datalist id="infraction-list">
                    <option value="745-50 - Velocidade superior à máxima permitida em até 20%">
                    <option value="605-03 - Avançar o sinal vermelho do semáforo">
                    <option value="518-51 - Deixar o condutor de usar o cinto de segurança">
                    <option value="763-32 - Estacionar no passeio">
                </datalist>
            </div>
        </div>
    </div>

    <div class="modal fade" id="discardModal" tabindex="-1" aria-labelledby="discardModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-danger" id="discardModalLabel"><i class="fas fa-trash-alt me-2"></i>Motivo do Descarte</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Por favor, informe o motivo do descarte desta imagem:</p>
                    <form id="discard-form">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="discardReason" id="reason1" value="Falso Positivo" checked>
                            <label class="form-check-label" for="reason1">Falso Positivo (Sem Veículo/Outro Objeto)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="discardReason" id="reason2" value="Sem OCR Válida">
                            <label class="form-check-label" for="reason2">Imagem sem OCR Válida (Ilegível)</label>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="radio" name="discardReason" id="reason3" value="Outros">
                            <label class="form-check-label" for="reason3">Outros</label>
                        </div>
                        
                        <div id="other-reason-container" class="d-none">
                            <label for="discardDescription" class="form-label small text-light">Descreva o motivo:</label>
                            <textarea class="form-control bg-secondary text-white border-secondary" id="discardDescription" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger fw-bold" id="confirm-discard-btn">CONFIRMAR DESCARTE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="autuacao.js"></script>
    <script> document.getElementById('logout-btn').addEventListener('click', () => { localStorage.clear(); window.location.href='login.html'; }); </script>
</body>
</html>
